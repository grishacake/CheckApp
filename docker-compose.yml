services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: checkapp
      POSTGRES_USER: checkapp
      POSTGRES_PASSWORD: checkapp
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkapp -d checkapp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: